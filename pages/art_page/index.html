<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Q S Yu | Visuals</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../../main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body class="art-page">
    <div id="site-header"></div>

    <canvas id="fx-canvas" aria-hidden="true"></canvas>

    <div class="subpage">
        <div class="art-grid" id="artGrid"></div>
    </div>

    <script src="projects.js"></script>
    <script>
        (function () {
            const grid = document.getElementById("artGrid");
            window.ART_PROJECTS.forEach(p => {
                const a = document.createElement("a");
                a.className = "art-tile";
                a.href = p.slug + ".html";
                a.setAttribute("aria-label", p.title);

                const img = document.createElement("img");
                img.src = "../../" + p.cover;
                img.alt = p.title;
                img.loading = "lazy";

                const label = document.createElement("span");
                label.className = "art-tile-title";
                label.textContent = p.title;

                a.append(img, label);
                grid.appendChild(a);
            });
        })();
    </script>
    <script src="../../pages/components/header_menu_content.js"></script>
    <script src="../../menu.js"></script>
</body>
</html>
