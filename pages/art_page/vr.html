<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Q S Yu | Visuals</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../../main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body class="art-page">
    <div id="site-header"></div>

    <canvas id="fx-canvas" aria-hidden="true"></canvas>

    <div class="subpage">
        <div class="subpage-name">
            <h1 id="projTitle"></h1>
        </div>
        <div class="subpage-right" id="projDesc"></div>
        <div class="art-photos" id="projPhotos"></div>
    </div>

    <script src="projects.js"></script>
    <script>
        (function () {
            // The file name (without .html) is the project slug, e.g. vr.html -> "vr"
            const slug = location.pathname.split("/").pop().replace(/\.html$/, "");
            const p = window.ART_PROJECTS.find(x => x.slug === slug);
            if (!p) { location.replace("index.html"); return; }

            document.title = "Q S Yu | " + p.title;
            document.getElementById("projTitle").textContent = p.title;
            const desc = document.getElementById("projDesc");
            [].concat(p.description).forEach(text => {
                const para = document.createElement("h2");
                para.innerHTML = text;
                desc.appendChild(para);
            });

            const photos = document.getElementById("projPhotos");
            p.images.forEach(src => {
                const img = document.createElement("img");
                img.src = "../../" + src;
                img.alt = p.title;
                img.loading = "lazy";
                photos.appendChild(img);
            });

            // Fade each image in as it scrolls into view.
            // If the browser can't do this, images just show normally.
            if ("IntersectionObserver" in window) {
                const imgs = photos.querySelectorAll("img");
                imgs.forEach(img => img.classList.add("reveal"));
                const io = new IntersectionObserver(entries => {
                    entries.forEach(e => {
                        if (e.isIntersecting) {
                            e.target.classList.add("shown");
                            io.unobserve(e.target);
                        }
                    });
                }, { rootMargin: "0px 0px -10% 0px" });
                imgs.forEach(img => io.observe(img));
            }
        })();
    </script>
    <script src="../../pages/components/header_menu_content.js"></script>
    <script src="../../menu.js"></script>
</body>
</html>
